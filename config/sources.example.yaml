arxiv:
  categories: [cs.AI, cs.CL, cs.LG]
  max_per_category: 30

# 已禁用：Reddit 在 2025-11 关掉自助 API，新 OAuth 凭证需人工审批；
# 旧的免登录 .json 接口对 GitHub Actions IP 100% 403。
# 拿到审批后把 subreddits 填回去即可启用。
# reddit:
#   subreddits: [LocalLLaMA, MachineLearning, singularity, OpenAI, ClaudeAI]
#   min_score: 50
#   max_per_sub: 20

hackernews:
  min_points: 80
  keywords: [AI, LLM, GPT, Claude, Gemini, model, neural, transformer, agent, RAG]

# 已禁用：twitterapi.io 要钱，且账号信号通常已被 RSS / 媒体 / HN 复述。
# 后续如果配置 TWITTERAPI_IO_KEY 想再启用，把 accounts 填回去即可。
# x:
#   accounts: [OpenAI, AnthropicAI, GoogleDeepMind, sama, karpathy, ylecun]

product_hunt:
  topics: [artificial-intelligence, developer-tools]

# 板块定义
sections:
  - id: model_release
    name: 模型发布
    keywords: [release, launch, available, GPT, Claude, Gemini, Llama, model]
  - id: company
    name: 公司动态
    keywords: [funding, acquisition, partnership, hire, lawsuit, valuation]
  - id: research
    name: 研究论文
    keywords: [paper, arxiv, benchmark, sota]
  - id: product
    name: 应用产品
    keywords: [app, agent, tool, feature, integration]
  - id: opinion
    name: 行业观点
    keywords: [interview, blog, essay, predict, regulation]
  - id: opensource
    name: 开源工具
    keywords: [github, open source, repo, library]
