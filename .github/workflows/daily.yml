name: AI Morning Post · daily

on:
  schedule:
    # 22:00 UTC = 06:00 CST
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ai-morning-post
        uses: actions/checkout@v4

      - name: Checkout marginalia (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: pyf-labrary/marginalia
          token: ${{ secrets.MARGINALIA_PUSH_TOKEN }}
          path: marginalia

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          LLM_BASE_URL:      ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY:       ${{ secrets.LLM_API_KEY }}
          LLM_MODEL:         ${{ secrets.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          WECHAT_APPID:      ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET:  ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_SKIP_PUBLISH: "1"
        run: python run_daily.py

      - name: Publish to Marginalia
        env:
          GH_TOKEN: ${{ secrets.MARGINALIA_PUSH_TOKEN }}
          MARGINALIA_REPO: ${{ github.workspace }}/marginalia
        run: |
          git -C marginalia config user.name "gittee-coder"
          git -C marginalia config user.email "259323426+gittee-coder@users.noreply.github.com"
          git -C marginalia remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/pyf-labrary/marginalia.git"
          python -m src.publish_marginalia

      - name: Commit ai-morning-post outputs
        run: |
          git config user.name  "gittee-coder"
          git config user.email "259323426+gittee-coder@users.noreply.github.com"
          git add out/
          if ! git diff --cached --quiet; then
            git commit -m "daily: $(date -u +%Y-%m-%d) outputs"
            git push
          else
            echo "no output changes"
          fi
